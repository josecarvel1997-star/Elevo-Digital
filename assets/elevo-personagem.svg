<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" role="img" aria-labelledby="title desc">
  <title id="title">Lia, personagem da Elevo Digital</title>
  <desc id="desc">Ilustração vetorial de uma consultora digital confiante, sorridente, com roupa azul marinho e detalhes violeta e turquesa, segurando um tablet. Fundo transparente.</desc>
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#536ffc"/><stop offset=".58" stop-color="#6859dc"/><stop offset="1" stop-color="#353a91"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecf4ff"/><stop offset="1" stop-color="#b9d8ed"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#293754"/><stop offset=".52" stop-color="#182236"/><stop offset="1" stop-color="#101828"/></linearGradient>
    <linearGradient id="tablet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263856"/><stop offset="1" stop-color="#131e31"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7e91ff"/><stop offset="1" stop-color="#a37dff"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <!-- subtle, removable brand halo -->
  <ellipse cx="456" cy="938" rx="284" ry="48" fill="#19264a" opacity=".2" filter="url(#shadow)"/>
  <circle cx="457" cy="430" r="323" fill="#7985ff" opacity=".055"/>
  <circle cx="457" cy="430" r="278" fill="none" stroke="#93a0ff" stroke-opacity=".13" stroke-width="2" stroke-dasharray="3 13"/>
  <!-- floating digital accents -->
  <g fill="none" stroke="#8fe7dc" stroke-width="4" opacity=".9"><path d="M167 353h34v34h-34z" rx="8"/><path d="M184 362v16m-8-8h16"/><circle cx="731" cy="324" r="21"/><path d="m722 324 6 6 12-13"/></g>
  <path d="m710 608 9 18 20 3-14 14 3 20-18-10-18 10 4-20-15-14 20-3z" fill="#9d8aff" opacity=".8"/>
  <path d="m228 570 6 12 13 2-9 9 2 13-12-6-12 6 2-13-9-9 13-2z" fill="#6ddfd2" opacity=".9"/>

  <!-- back hair -->
  <path d="M280 372c-34-107-8-215 79-271 66-43 157-37 214 9 74 60 88 162 50 267l-26 201c-8 80-72 121-180 116-106-5-154-48-158-127z" fill="url(#hair)"/>
  <!-- neck -->
  <path d="M390 558v102c0 42 32 69 73 69 42 0 75-28 75-69V558z" fill="#b96f59"/>
  <path d="M390 584c20 30 48 47 77 47 27 0 51-12 71-36v-58H390z" fill="#995647" opacity=".5"/>
  <!-- ears -->
  <ellipse cx="309" cy="398" rx="30" ry="43" fill="#c9846b"/>
  <ellipse cx="620" cy="398" rx="30" ry="43" fill="#c9846b"/>
  <path d="M296 389q13-16 25 2m286-2q13-16 25 2" fill="none" stroke="#925447" stroke-width="5" stroke-linecap="round"/>
  <!-- face -->
  <path d="M306 337c0-112 62-178 154-178s154 66 154 178v88c0 111-69 188-154 188s-154-77-154-188z" fill="#d99478"/>
  <path d="M320 325c13-83 57-125 129-125 63 0 110 36 139 99-38-14-68-38-88-73-32 45-90 75-180 84z" fill="#c9846b" opacity=".38"/>
