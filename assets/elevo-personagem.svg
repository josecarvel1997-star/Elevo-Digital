  <path d="M258 748c-33 42-53 96-67 160-10 49 10 79 46 70 29-7 46-50 59-98l36-107z" fill="#bd755f"/>
  <path d="M635 748c35 40 55 96 69 160 10 49-10 79-46 70-29-7-46-50-59-98l-36-107z" fill="#cb826a"/>
