  <path d="M641 738c39 58 60 130 70 215-24 23-61 34-97 29-10-64-27-131-58-201z" fill="url(#jacket)"/>
  <path d="M224 881q28 18 64 20m393-20q-28 18-64 20" fill="none" stroke="#8998ff" stroke-width="4" opacity=".6"/>
