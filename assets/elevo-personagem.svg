  <path d="M305 300c51-3 99-22 139-54 39 33 83 49 133 46-41-19-69-46-88-82-38 48-97 78-184 90z" fill="#314361" opacity=".7"/>
  <path d="M307 373c-17 95 1 214 49 277-44-12-74-48-83-100l-13-128c-5-45 9-76 47-95zM602 354c25 74 20 197-19 277 48-15 74-53 80-113l9-108c4-38-17-59-70-56z" fill="#18243a"/>
  <!-- eyebrows -->
  <path d="M352 377q27-18 55 0m88 0q28-18 55 0" fill="none" stroke="#493b3a" stroke-width="7" stroke-linecap="round"/>
  <!-- eyes -->
  <path d="M359 403q21-19 43 0-21 22-43 0zm91 0q21-19 43 0-21 22-43 0z" fill="#fff8f0"/>
  <ellipse cx="383" cy="403" rx="8" ry="10" fill="#344b65"/><ellipse cx="475" cy="403" rx="8" ry="10" fill="#344b65"/>
  <circle cx="385" cy="400" r="3" fill="#fff"/><circle cx="477" cy="400" r="3" fill="#fff"/>
  <path d="m427 408-10 46q11 9 24 0" fill="none" stroke="#a95d50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M391 482q37 32 74 0" fill="none" stroke="#8c4145" stroke-width="6" stroke-linecap="round"/>
  <path d="M400 482q28 19 56 0" fill="none" stroke="#fff1e8" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="354" cy="449" rx="23" ry="11" fill="#ed927f" opacity=".38"/><ellipse cx="507" cy="449" rx="23" ry="11" fill="#ed927f" opacity=".38"/>
  <!-- small ear jewelry -->
  <circle cx="306" cy="432" r="8" fill="#e7c779"/><circle cx="623" cy="432" r="8" fill="#e7c779"/>

