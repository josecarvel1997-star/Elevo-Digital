  <path d="m381 645 75 89-56 54-50-117zm171 0-95 89 48 49 62-112z" fill="#7589ff"/>
  <path d="m381 645 48 97-30 46-49-117zm171 0-69 98 22 40 62-112z" fill="#8875ef" opacity=".7"/>
