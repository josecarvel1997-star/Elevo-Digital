  <path d="M381 645c-59 10-99 44-125 103-31 69-45 152-55 251h518c-10-99-24-182-55-251-26-59-66-93-125-103l-76 72z" fill="url(#jacket)"/>
  <path d="m382 643 74 91 49-1 47-90-42-23c-12 28-30 43-54 43-23 0-42-15-54-43z" fill="url(#shirt)"/>
