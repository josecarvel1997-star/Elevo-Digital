  <g transform="rotate(-5 461 827)">
    <rect x="329" y="755" width="272" height="157" rx="18" fill="#0d1524" stroke="#8999ff" stroke-width="5"/>
    <rect x="340" y="766" width="250" height="135" rx="10" fill="url(#tablet)"/>
    <rect x="356" y="784" width="61" height="9" rx="4.5" fill="#8d9aff" opacity=".85"/>
    <rect x="356" y="803" width="120" height="6" rx="3" fill="#79869d" opacity=".6"/>
    <rect x="356" y="819" width="94" height="6" rx="3" fill="#79869d" opacity=".48"/>
    <rect x="356" y="842" width="215" height="43" rx="7" fill="#1c2a40"/>
    <path d="M367 873v-11m19 11v-22m19 22v-15m19 15v-27m19 27v-18m19 18v-31m19 31v-21m19 21v-25m19 25v-35" stroke="#74dace" stroke-width="6" stroke-linecap="round" opacity=".8"/>
    <circle cx="582" cy="833" r="4" fill="#8290ff"/>
  </g>
  <!-- hands resting on the tablet edge -->
  <path d="M344 781c-23-12-39-3-44 17l-8 38c-5 24 12 35 32 25l37-21zm234-2c22-12 39-3 43 17l8 38c5 24-12 35-32 25l-37-21z" fill="#d99478"/>
  <path d="m300 829 26 10m-21 4 23 9m276-23-25 10m20 4-23 9" stroke="#b96f59" stroke-width="4" stroke-linecap="round"/>
  <!-- collar accents / brand pin -->
  <path d="m355 713 20 41m219-41-23 42" stroke="#a9b3ff" stroke-width="3" opacity=".8"/>
  <circle cx="572" cy="729" r="13" fill="#17213b" stroke="#94e5dc" stroke-width="2"/>
  <path d="m566 731 5-8 3 6 5-2-6 10-3-5z" fill="#8fe7dc"/>
  <!-- badge -->
  <g transform="translate(674 731)"><rect width="70" height="70" rx="20" fill="#161e31" stroke="#7689ff" stroke-width="2"/><path d="M18 48V22h10l15 16V22h10v26H43L28 32v16z" fill="url(#orb)"/><path d="m50 21 9-7-1 12" fill="none" stroke="#78ddd2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
